name: Build

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Formatting, -Xlint:all -Werror, every test, strict Javadoc and benchmark compilation.
      - name: Build
        run: ./gradlew build
      - name: Check production code with Error Prone
        run: ./gradlew errorProne
      - name: Verify native read limits and closed execution lifetimes
        run: ./gradlew nativeReadBudgetProbe executionRetentionProbe languageInputAllocationProbe
      - name: Verify line and branch coverage
        run: ./gradlew jacocoTestCoverageVerification
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests
